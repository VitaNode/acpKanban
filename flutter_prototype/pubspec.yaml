name: acp_kanban
description: AI Kanban Mobile Prototype with ACP Protocol.
version: 0.2.4+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  uuid: ^4.0.0
  intl: ^0.19.0
  multicast_dns: ^0.3.2+2
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  cryptography: ^2.5.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2
  audioplayers: ^6.0.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:                                                                                                                               
  android: true                                                                                                                              
  ios: true                                                                                                                                  
  image_path: "assets/logo.png"                                                                                                         
  adaptive_icon_background: "#000000"  # Android 自适应图标背景色                                                                            
  adaptive_icon_foreground: "assets/logo.png"  # Android 自适应图标前景