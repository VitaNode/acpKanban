name: Build Clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: cd flutter_prototype && flutter pub get
      - name: Build APK
        run: cd flutter_prototype && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acpKanban-android
          path: flutter_prototype/build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: cd flutter_prototype && flutter pub get
      - name: Build macOS
        run: cd flutter_prototype && flutter build macos --release
      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p build-dmg
          cp -R flutter_prototype/build/macos/Build/Products/Release/acp_kanban.app build-dmg/
          create-dmg \
            --volname "acpKanban" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "acp_kanban.app" 175 120 \
            --hide-extension "acp_kanban.app" \
            --app-drop-link 425 120 \
            "acpKanban-macOS.dmg" \
            "build-dmg/"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: acpKanban-macos
          path: acpKanban-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: cd flutter_prototype && flutter pub get
      - name: Build Windows
        run: |
          cd flutter_prototype
          flutter build windows --release
      - name: Package Windows
        run: |
          Compress-Archive -Path flutter_prototype/build/windows/x64/runner/Release/* -DestinationPath acpKanban-Windows.zip
      - name: Upload Windows Zip
        uses: actions/upload-artifact@v4
        with:
          name: acpKanban-windows
          path: acpKanban-Windows.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: cd flutter_prototype && flutter pub get
      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | xargs)

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # More robust UUID extraction using PlistBuddy
          security cms -D -i $PP_PATH > $RUNNER_TEMP/pp.xml
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/pp.xml)
          echo "UUID=$UUID" >> $GITHUB_ENV
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
      - name: Build IPA
        run: |
          cd flutter_prototype
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>76CXQ49Q8Z</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.qnghm.kanbanAI202603</key>
              <string>${{ env.UUID }}</string>
            </dict>
          </dict>
          </plist>
          EOF
          flutter build ipa --release \
            --export-options-plist=ExportOptions.plist \
            --build-number 1 \
            --no-codesign
          
          # Manually archive and export if flutter build ipa fails to respect manual signing
          # But for now, let's try with --no-codesign first (Wait, build ipa --no-codesign might not generate ipa)
          # Actually, the standard way for manual signing in CI is:
          # flutter build ios --release --no-codesign
          # xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphoneos -configuration Release archive ...
          
          # Let's try one more time with the fixed project settings and build ipa
          flutter build ipa --release \
            --export-options-plist=ExportOptions.plist \
            --build-number 1
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: acpKanban-ios
          path: flutter_prototype/build/ios/ipa/*.ipa

  release:
    needs: [build-android, build-macos, build-windows, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/acpKanban-android/app-release.apk
            artifacts/acpKanban-macos/acpKanban-macOS.dmg
            artifacts/acpKanban-windows/acpKanban-Windows.zip
            artifacts/acpKanban-ios/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
