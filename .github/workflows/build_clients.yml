name: Build Clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: cd flutter_prototype && flutter pub get
      - name: Build APK
        run: cd flutter_prototype && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acpKanban-android
          path: flutter_prototype/build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: cd flutter_prototype && flutter pub get
      - name: Build macOS
        run: cd flutter_prototype && flutter build macos --release
      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p build-dmg
          cp -R flutter_prototype/build/macos/Build/Products/Release/acp_kanban.app build-dmg/
          create-dmg \
            --volname "acpKanban" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "acp_kanban.app" 175 120 \
            --hide-extension "acp_kanban.app" \
            --app-drop-link 425 120 \
            "acpKanban-macOS.dmg" \
            "build-dmg/"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: acpKanban-macos
          path: acpKanban-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: cd flutter_prototype && flutter pub get
      - name: Build Windows
        run: |
          cd flutter_prototype
          flutter build windows --release
      - name: Package Windows
        run: |
          Compress-Archive -Path flutter_prototype/build/windows/x64/runner/Release/* -DestinationPath acpKanban-Windows.zip
      - name: Upload Windows Zip
        uses: actions/upload-artifact@v4
        with:
          name: acpKanban-windows
          path: acpKanban-Windows.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: cd flutter_prototype && flutter pub get
      - name: Build and Sign IPA
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | xargs)

          # Diagnostic: List certificates
          echo "Installed Identities:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          
          security cms -D -i $PP_PATH > $RUNNER_TEMP/pp.xml
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/pp.xml)
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          # Detect Export Method and Identity (Prioritize Development check)
          if /usr/libexec/PlistBuddy -c "Print Entitlements:get-task-allow" $RUNNER_TEMP/pp.xml 2>/dev/null | grep -q "true"; then
            EXPORT_METHOD="development"
            IDENTITY="iPhone Developer"
          elif /usr/libexec/PlistBuddy -c "Print ProvisionsAllDevices" $RUNNER_TEMP/pp.xml >/dev/null 2>&1; then
            EXPORT_METHOD="enterprise"
            IDENTITY="iPhone Distribution"
          elif /usr/libexec/PlistBuddy -c "Print ProvisionedDevices" $RUNNER_TEMP/pp.xml >/dev/null 2>&1; then
            EXPORT_METHOD="ad-hoc"
            IDENTITY="iPhone Distribution"
          else
            EXPORT_METHOD="app-store"
            IDENTITY="iPhone Distribution"
          fi
          
          echo "Detected Export Method: $EXPORT_METHOD"
          echo "Detected Identity: $IDENTITY"
          echo "EXPORT_METHOD=$EXPORT_METHOD" >> $GITHUB_ENV

          # Inject UUID and force Manual signing in pbxproj
          PBXPROJ="flutter_prototype/ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' "s/DEVELOPMENT_TEAM = 76CXQ49Q8Z;/DEVELOPMENT_TEAM = 76CXQ49Q8Z; PROVISIONING_PROFILE_SPECIFIER = \"$UUID\"; CODE_SIGN_IDENTITY = \"$IDENTITY\";/g" "$PBXPROJ"
          
          # Create ExportOptions.plist
          cat <<EOF > flutter_prototype/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>teamID</key>
            <string>76CXQ49Q8Z</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.qnghm.kanbanAI202603</key>
              <string>$UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          cd flutter_prototype
          flutter build ipa --release \
            --export-options-plist=ExportOptions.plist \
            --build-number 1
          
          echo "Listing output directory:"
          ls -R build/ios/ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: acpKanban-ios
          path: flutter_prototype/build/ios/ipa/*.ipa
      - name: Upload to App Store Connect
        if: success()
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ "$EXPORT_METHOD" != "app-store" ]; then
            echo "========================================================================"
            echo "WARNING: Skipping App Store Connect upload because EXPORT_METHOD is '$EXPORT_METHOD'."
            echo "App Store Connect only accepts 'app-store' signed builds."
            echo "Please use an App Store Distribution Provisioning Profile and Certificate to upload."
            echo "========================================================================"
            exit 0
          fi

          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "Error: App Store Connect secrets (APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID) are not configured."
            exit 1
          fi

          # 1. Create directory and write private key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          
          # 2. Find the generated IPA dynamically
          IPA_PATH=$(find flutter_prototype/build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: IPA file not found!"
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"

          # 3. Validate App
          echo "Validating IPA with App Store Connect..."
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
            
          # 4. Upload App
          echo "Uploading IPA to App Store Connect..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

  release:
    needs: [build-android, build-macos, build-windows, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -R artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/acpKanban-android/app-release.apk
            artifacts/acpKanban-macos/acpKanban-macOS.dmg
            artifacts/acpKanban-windows/acpKanban-Windows.zip
            artifacts/acpKanban-ios/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
